[alembic]
script_location = alembic

# url = driver://user:password@localhost:port/db
prepend_driver = auto

# optional stretching.  the below adds ... to connection info
# log_stretch = 30

# further arguments sent to alembic upgrade head
# process_argument_cache = 128

sqlalchemy.url =

# If using SQLModel / SQLAlchemy 2.0 style, set this:
engine_modules = sqlmodel

# Logging configuration
[loggers]
keys = root

[handlers]
keys = consoleHandler

[formatters]
keys = genericFormatter

[logger_root]
level = INFO
handlers = consoleHandler

[handler_consoleHandler]
class = StreamHandler
args = (sys.stderr,)

[formatter_genericFormatter]
format = %(levelname)s - %(name)s - %(message)s
datefmt = %Y-%m-%d %H:%M:%S:%S